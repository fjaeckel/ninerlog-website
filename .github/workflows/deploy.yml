name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the sitemap derives <lastmod> from the last commit
          # touching each page. A shallow clone would date every page to the
          # most recent deploy, telling search engines the whole site changes
          # on every push.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Notify IndexNow (Bing, Yandex, Seznam, …) only after the site is live.
  # Runs as a downstream job of `deploy`, so it fires exclusively on a
  # successful Pages deployment — never on a failed or skipped one.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      # IndexNow keys are public by design (the same value is hosted at
      # https://ninerlog.com/<key>.txt), so it lives in the workflow, not secrets.
      HOST: ninerlog.com
      KEY: b800d4dc908c442cbb0ef2112f93e191
    steps:
      # The sitemap is generated at build time and no longer exists in the
      # repo, so read it from the site that was just published. This also
      # means we only ever submit URLs that are genuinely live.
      - name: Submit sitemap URLs to IndexNow
        run: |
          set -euo pipefail
          urls=$(curl -sSf "https://$HOST/sitemap.xml" | grep -oP '(?<=<loc>)[^<]+' | jq -R . | jq -s .)
          count=$(printf '%s' "$urls" | jq length)
          echo "Submitting $count URL(s) to IndexNow"
          payload=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "https://$HOST/$KEY.txt" \
            --argjson urlList "$urls" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          code=$(curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$payload" \
            -o /tmp/indexnow-response.txt -w '%{http_code}')
          echo "IndexNow responded HTTP $code"
          cat /tmp/indexnow-response.txt || true
          # 200 OK and 202 Accepted both mean success; anything >=400 is a real failure.
          if [ "$code" -ge 400 ]; then
            echo "::error::IndexNow submission failed with HTTP $code"
            exit 1
          fi
